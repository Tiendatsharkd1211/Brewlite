# Chạy toàn bộ BrewLite: docker compose up --build
#   Frontend  http://localhost:3000
#   Backend   http://localhost:3001  (GET /health để kiểm tra)
#   Postgres  localhost:5433 (user/pass/db: brewlite)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: brewlite
      POSTGRES_DB: brewlite
    ports:
      - "5433:5432"
    volumes:
      - pgdata_v3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite -d brewlite"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://brewlite:brewlite@db:5432/brewlite?schema=public
      JWT_SECRET: ${JWT_SECRET:-doi-chuoi-nay-khi-trien-khai-that}
      FRONTEND_URL: http://localhost:3000
      # Mã VNPay sandbox: ghi vào file .env đặt cạnh docker-compose.yml (VNP_TMN_CODE=..., VNP_HASH_SECRET=...)
      VNP_TMN_CODE: ${VNP_TMN_CODE:-}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET:-}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  # Đổi tên kho dữ liệu khi lược đồ CSDL thay đổi lớn (chuyển sang VNPay, bỏ tài khoản ảo) để có CSDL sạch
  pgdata_v3:
